name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Install patchright browser (Chrome for Testing)
        run: python -m patchright install chrome

      - name: Build with PyInstaller
        run: pyinstaller build/scraper.spec --clean --noconfirm

      - name: Rename binary with version tag
        run: |
          cp dist/SupplierScraper dist/SupplierScraper-${{ github.ref_name }}-linux

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SupplierScraper-${{ github.ref_name }}-linux

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Install patchright browser (Chrome for Testing)
        run: python -m patchright install chrome

      - name: Build with PyInstaller
        run: pyinstaller build/scraper.spec --clean --noconfirm

      - name: Rename binary with version tag
        run: |
          copy dist\SupplierScraper.exe dist\SupplierScraper-${{ github.ref_name }}-windows.exe

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SupplierScraper-${{ github.ref_name }}-windows.exe
