name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p release/supplier-scraper
          cp -r Supplier_Scraper.ipynb scraper/ README.md release/supplier-scraper/
          cd release
          zip -r "supplier-scraper-${{ github.ref_name }}.zip" supplier-scraper/
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/supplier-scraper-${{ github.ref_name }}.zip
