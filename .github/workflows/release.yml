name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller build/scraper.spec --clean --noconfirm

      - name: Create compressed archive
        run: |
          cd dist
          tar czf SupplierScraper-linux-${{ github.ref_name }}.tar.gz SupplierScraper/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SupplierScraper-linux-${{ github.ref_name }}.tar.gz

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller build/scraper.spec --clean --noconfirm

      - name: Create compressed archive
        run: |
          cd dist
          Compress-Archive -Path SupplierScraper\* -DestinationPath SupplierScraper-windows-${{ github.ref_name }}.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SupplierScraper-windows-${{ github.ref_name }}.zip
